services:
    triton:
        image: nvcr.io/nvidia/tritonserver:26.11-py3
        # Enable with gpu
        # environment:
        #   - NVIDIA_VISIBLE_DEVICES=all
        #   - NVIDIA_DRIVER_CAPABILITIES=compute,utility
        ports:
            - "8000:8000"
            - "8001:8001"
            - "8002:8002"
        volumes:
            - ./models:/models
        command: ["tritonserver", "--model-repository=/models"]
