services:
    triton:
        image: nvcr.io/nvidia/tritonserver:26.11-py3
        # Enable with gpu
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
        ports:
            - "8000:8000"
            - "8001:8001"
            - "8002:8002"
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        volumes:
            - ./models:/models
        command: ["tritonserver", "--model-repository=/models"]
